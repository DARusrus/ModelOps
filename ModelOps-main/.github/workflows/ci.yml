name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    name: Lint · Type-check · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ── 1. Lint ────────────────────────────────────────────────────────────
      - name: Run ESLint
        run: npm run lint

      # ── 2. Type-check ─────────────────────────────────────────────────────
      # noEmit is already set in tsconfig.json — this verifies strict TS.
      - name: Run TypeScript compiler check
        run: npx tsc --noEmit

      # ── 3. Unit / integration tests ────────────────────────────────────────
      # Vitest runs in node environment (vitest.config.ts: environment: 'node').
      # No real provider keys are required — service.ts falls back to the
      # deterministic offline fallback when GROQ_API_KEY / GEMINI_API_KEY are absent.
      - name: Run tests
        run: npm test
        env:
          # Pass dummy values so env.ts does not throw on startup.
          # The actual AI calls are never made in CI — the offline fallback path
          # is exercised instead (see src/lib/modelops/service.ts).
          GROQ_API_KEY: ci-placeholder-not-real
          GEMINI_API_KEY: ci-placeholder-not-real
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      # ── 4. Production build ────────────────────────────────────────────────
      # Confirms the Next.js production bundle compiles without errors.
      # This is the definitive gate before any Vercel deployment.
      - name: Build production bundle
        run: npm run build
        env:
          GROQ_API_KEY: ci-placeholder-not-real
          GEMINI_API_KEY: ci-placeholder-not-real
          NEXT_PUBLIC_APP_URL: http://localhost:3000
