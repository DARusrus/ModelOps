name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Generate runtime dependency SBOM
        run: npm sbom --omit=dev --sbom-format=cyclonedx > modelops-sbom.cdx.json
      - name: Preserve runtime dependency SBOM
        uses: actions/upload-artifact@v4
        with:
          name: modelops-runtime-sbom-${{ github.sha }}
          path: modelops-sbom.cdx.json
          retention-days: 30
